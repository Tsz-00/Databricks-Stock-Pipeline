# This is a Declarative Automation Bundle definition for stock_streaming.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: stock_streaming
  uuid: c541e91c-1461-4abc-bb49-64711fc1eb1f
  engine: direct

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

resources:
  external_locations:
      stock_managed_location:
        name: stock_managed_location
        url: 'abfss://stock-streaming@dbdeastroage.dfs.core.windows.net/'
        credential_name: db_dea_cred
        comment: "Managed storage for stock_streaming project"
        grants:
          - principal: lamtszhong2014@gmail.com
            privileges:
              - CREATE_MANAGED_STORAGE
              - CREATE_EXTERNAL_TABLE
              - READ_FILES
              - WRITE_FILES

  catalogs:
    stock_catalog:
      name: ${var.catalog}
      comment: "Catalog for stock_streaming"
      storage_root: 'abfss://stock-streaming@dbdeastroage.dfs.core.windows.net/' 

  schemas:
    yfinance:
      name: yfinance
      catalog_name: ${var.catalog}
      comment: "Landing schema for yfinance data"
      
    bronze:
      name: bronze
      catalog_name: ${var.catalog}
      comment: "Bronze schema for stock_streaming"

    silver:
      name: silver
      catalog_name: ${var.catalog}
      comment: "Silver schema for stock_streaming"

    gold:
      name: gold
      catalog_name: ${var.catalog}
      comment: "Gold schema for stock_streaming"

  volumes:
    landing:
      name: landing
      catalog_name: ${var.catalog}
      schema_name: yfinance
      comment: "Raw yfinance landing zone"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405619175947828.8.azuredatabricks.net
    variables:
      catalog: stock_dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405619175947828.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/lamtszhong2014@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lamtszhong2014@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stock_prod
    permissions:
      - user_name: lamtszhong2014@gmail.com
        level: CAN_MANAGE
